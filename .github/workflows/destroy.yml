name: "Destroy workflow for EKS cluster"

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      eks_cluster_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup environment
        uses: ./.github/actions/setup-composite
        with:
          aws-region: ${{ inputs.aws_region }}
          aws-access-key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          terraform_version: ${{ inputs.terraform_version }}
          
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan for Destroy
        run: terraform plan -destroy

      - name: Empty ecr images
        run: |
          for repo in $(aws ecr describe-repositories --region ${{ inputs.aws_region }} --query "repositories[?starts_with(repositoryName, \`devopslab-\`)].repositoryName" --output text); do
            echo "Deleting images from repository: $repo"
            image_ids=$(aws ecr list-images --repository-name "$repo" --query "imageIds" --output json 2>/dev/null)
            if [ "$image_ids" != "[]" ] && [ "$image_ids" != "null" ]; then
              aws ecr batch-delete-image --repository-name "$repo" --image-ids "$image_ids" || true
            fi
          done
      
      - name: Update kubeconfig
        run: |
          if ! aws eks describe-cluster --name ${{ inputs.eks_cluster_name }} --region ${{ inputs.aws_region }}; then
            echo "Cluster ${{ inputs.eks_cluster_name }} not found, skipping kubeconfig update."
          else
            aws eks update-kubeconfig \
              --name ${{ inputs.eks_cluster_name }} \
              --region ${{ inputs.aws_region }}
          fi

      - name: Delete all ingress resources from all namespaces
        run: |
          kubectl delete ingress --all --all-namespaces || true
          echo "Waiting for load balancer cleanup..."
          sleep 30

      - name: Delete aws-load-balancer-controller
        run: |
          if helm list -n kube-system | grep -q aws-load-balancer-controller; then
            helm uninstall aws-load-balancer-controller -n kube-system
          fi
          sleep 15
      
      - name: Delete aws load balancer
        run: |
          LB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'shareduniralb')].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$LB_ARN" ] || [ "$LB_ARN" = "None" ]; then
            echo "Load balancer 'shareduniralb' not found, skipping deletion."
          else
            echo "Deleting load balancer: $LB_ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$LB_ARN"
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
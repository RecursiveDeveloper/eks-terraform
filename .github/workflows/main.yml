name: "Workflow to deploy an EKS cluster into AWS"

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What action would you like to do?'
        required: true
        type: choice
        options:
          - 'deploy'
          - 'destroy'
  # push:
  #   paths-ignore:
  #     - '.github/**'
  #     - '.gitignore'
  #     - 'README.md'
  #   branches:
  #     - main

env:
  TERRAFORM_VERSION: '1.12.2'
  AWS_REGION: 'us-east-1'

jobs:
  call-deploy-workflow:
    if: ${{ github.event.inputs.action == 'deploy' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      terraform_version: ${{ github.env.TERRAFORM_VERSION }}
      aws_region: ${{ github.env.AWS_REGION }}

  call-destroy-workflow:
    if: ${{ github.event.inputs.action == 'destroy' }}
    uses: ./.github/workflows/destroy.yml
    secrets: inherit
    with:
      terraform_version: ${{ github.env.TERRAFORM_VERSION }}
      aws_region: ${{ github.env.AWS_REGION }}